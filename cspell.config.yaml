# Spell checking for the repository and for the editor (the Code Spell Checker
# extension reads this file). British English is the project dictionary.
version: "0.2"
language: en-GB

ignorePaths:
  - "src/hexapod_description/meshes/**"
  - "src/reference_img/**"
  - "build/**"
  - "install/**"
  - "log/**"
  - ".git/**"

